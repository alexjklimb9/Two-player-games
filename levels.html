<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Choose Level</title>
    <link rel="stylesheet" href="style.css?v=161" />
    <link rel="stylesheet" href="level-cards.css?v=161" />
  </head>
  <body>
    <main id="app">
      <section class="home-screen">
        <div class="home-inner">
          <p class="eyebrow">Two Player Games</p>
          <h1 id="title">Choose Level</h1>
          <p id="subtitle" class="home-subtitle">Pick a challenge.</p>
          <div id="levelGrid" class="game-grid level-grid"></div>
          <p style="text-align:center;margin-top:22px"><a class="secondary-button" href="./?v=161">Back to Games</a></p>
        </div>
      </section>
    </main>

    <script src="app-config.js?v=161"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const game = params.get('game') || 'balance';
      const data = {
        balance: {
          title: 'Balance Board',
          subtitle: 'Dodge falling objects and keep the shared board steady.',
          levels: [
            ['Easy', 'Dodge 15 objects.', 1],
            ['Normal', 'Dodge 25 objects.', 2],
            ['Hard', 'Dodge 40 objects.', 3],
            ['Expert', 'Dodge 60 objects.', 4],
            ['Endless', 'Survive as long as possible.', 5]
          ]
        },
        seesaw: {
          title: 'Trampoline Climb',
          subtitle: 'Bounce higher while platforms become harder to chain.',
          levels: [
            ['Easy', 'Reach height 50.', 1],
            ['Normal', 'Reach height 100.', 2],
            ['Hard', 'Reach height 150.', 3],
            ['Expert', 'Reach height 220.', 4],
            ['Endless', 'Climb as high as possible.', 5]
          ]
        },
        asteroids: {
          title: 'Asteroid Crew',
          subtitle: 'Survive together while asteroids keep entering the field.',
          levels: [
            ['Easy', 'Survive 45 seconds.', 1],
            ['Normal', 'Survive 60 seconds.', 2],
            ['Hard', 'Survive 90 seconds.', 3],
            ['Expert', 'Survive 120 seconds.', 4],
            ['Endless', 'Survive as long as possible.', 5]
          ]
        },
        core: {
          title: 'Core Defense',
          subtitle: 'Build, rotate, and repair a shared defense ring.',
          levels: [
            ['Tutorial', 'Learn tower counters, enemy types, boost timing, and defense rotation.', 0, 'Tutorial'],
            ['Easy', 'Survive 5 waves.', 1],
            ['Normal', 'Survive 8 waves.', 2],
            ['Hard', 'Survive 12 waves.', 3],
            ['Expert', 'Survive 15 waves.', 4],
            ['Endless', 'Defend as long as possible.', 5]
          ]
        },
        dual: {
          title: 'Dual Gravity',
          subtitle: 'Shared-line co-op puzzles with mirrored gravity. No endless mode yet.',
          levels: [
            ['Tutorial', 'Learn movement, launch pads, traps, platforms, switches, and finish rails.', 0, 'Tutorial'],
            ['Level 1: Coordination', 'Chain launch pads, spike traps, and the one-player platform.', 1, 'Level 1'],
            ['Level 2: Split Tasks', 'One player creates safety while the other advances.', 2, 'Level 2'],
            ['Level 3: Moving Systems', 'Time chained platforms, enemies, traps, and launches.', 3, 'Level 3'],
            ['Level 4: Co-op Chaos', 'Overlapping mechanics with faster reactions and more communication.', 4, 'Level 4'],
            ['Level 5: Final Trial', 'A longer gauntlet combining every Dual Gravity mechanic.', 5, 'Level 5']
          ]
        }
      };

      const cfg = data[game] || data.balance;
      document.getElementById('title').textContent = cfg.title;
      document.getElementById('subtitle').textContent = cfg.subtitle;
      const grid = document.getElementById('levelGrid');
      const levelClasses = ['level-tutorial', 'level-easy', 'level-normal', 'level-hard', 'level-expert', 'level-endless'];

      cfg.levels.forEach(level => {
        const a = document.createElement('a');
        const levelNumber = level[2];
        const levelClass = levelNumber === 0 ? 'level-tutorial' : levelClasses[levelNumber] || 'level-normal';
        a.className = `game-card level-card ${levelClass}`;
        const cacheVersion = (window.AppConfig && window.AppConfig.CACHE_VERSION) || '161';
        a.href = `./?game=${game}&level=${levelNumber}&v=${cacheVersion}`;
        const kicker = level[3] || (levelNumber === 5 ? 'Endless Mode' : `Difficulty ${levelNumber}`);
        const filled = levelNumber === 0 ? 1 : Math.min(levelNumber, 5);
        const pips = levelNumber === 5
          ? '<span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span>'
          : Array.from({ length: 5 }, (_, i) => `<span class="${i < filled ? 'filled' : ''}"></span>`).join('');
        a.innerHTML = `<div><div class="level-top-row"><p class="card-kicker">${kicker}</p><div class="difficulty-pips">${pips}</div></div><h2>${level[0]}</h2><p>${level[1]}</p></div><span class="play-chip">Play</span>`;
        grid.appendChild(a);
      });
    </script>
  </body>
</html>
