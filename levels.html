<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Choose Level</title>
    <link rel="stylesheet" href="style.css?v=54" />
  </head>
  <body>
    <main id="app">
      <section class="home-screen">
        <div class="home-inner">
          <p class="eyebrow">Two Player Games</p>
          <h1 id="title">Choose Level</h1>
          <p id="subtitle" class="home-subtitle">Pick a challenge.</p>
          <div id="levelGrid" class="game-grid"></div>
          <p style="text-align:center;margin-top:22px"><a class="secondary-button" href="./?v=54">Back to Games</a></p>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const game = params.get('game') || 'balance';
      const data = {
        balance: {
          title: 'Balance Board',
          subtitle: 'Dodge falling objects and keep the shared board steady.',
          levels: [
            ['Easy', 'Dodge 15 objects.', 1],
            ['Normal', 'Dodge 25 objects.', 2],
            ['Hard', 'Dodge 40 objects.', 3],
            ['Expert', 'Dodge 60 objects.', 4],
            ['Endless', 'Survive as long as possible.', 5]
          ]
        },
        seesaw: {
          title: 'Trampoline Climb',
          subtitle: 'Bounce higher while platforms become harder to chain.',
          levels: [
            ['Easy', 'Reach height 50.', 1],
            ['Normal', 'Reach height 100.', 2],
            ['Hard', 'Reach height 150.', 3],
            ['Expert', 'Reach height 220.', 4],
            ['Endless', 'Climb as high as possible.', 5]
          ]
        },
        asteroids: {
          title: 'Asteroid Crew',
          subtitle: 'Survive together while asteroids keep entering the field.',
          levels: [
            ['Easy', 'Survive 45 seconds.', 1],
            ['Normal', 'Survive 60 seconds.', 2],
            ['Hard', 'Survive 90 seconds.', 3],
            ['Expert', 'Survive 120 seconds.', 4],
            ['Endless', 'Survive as long as possible.', 5]
          ]
        },
        core: {
          title: 'Core Defense',
          subtitle: 'Build, rotate, and repair a shared defense ring.',
          levels: [
            ['Easy', 'Survive 5 waves.', 1],
            ['Normal', 'Survive 8 waves.', 2],
            ['Hard', 'Survive 12 waves.', 3],
            ['Expert', 'Survive 15 waves.', 4],
            ['Endless', 'Defend as long as possible.', 5]
          ]
        }
      };

      const cfg = data[game] || data.balance;
      document.getElementById('title').textContent = cfg.title;
      document.getElementById('subtitle').textContent = cfg.subtitle;
      const grid = document.getElementById('levelGrid');
      cfg.levels.forEach(level => {
        const a = document.createElement('a');
        a.className = 'game-card';
        a.href = `./?game=${game}&level=${level[2]}&v=54`;
        const kicker = level[2] === 5 ? 'Endless Mode' : `Difficulty ${level[2]}`;
        a.innerHTML = `<div><p class="card-kicker">${kicker}</p><h2>${level[0]}</h2><p>${level[1]}</p></div><span class="play-chip">Play</span>`;
        grid.appendChild(a);
      });
    </script>
  </body>
</html>
